name: Ingest events

# Collects events from the registered sources and publishes the feed to the `feed` branch.
# The Android app downloads https://raw.githubusercontent.com/<owner>/<repo>/feed/index.json
on:
  schedule:
    - cron: "17 10 * * *"    # once a day, 04:17 Saskatoon time (per-source frequency is enforced inside the job)
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore per-source frequency and check every source now"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/ingest.yml"]

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check out previous feed
        run: |
          if git ls-remote --exit-code --heads origin feed >/dev/null 2>&1; then
            git fetch --depth 1 origin feed
            git worktree add feed origin/feed
          else
            mkdir -p feed
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Unit tests
        working-directory: backend
        run: python -m pytest -q

      - name: Run ingest
        working-directory: backend
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: |
          FORCE=""
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.force }}" = "true" ]; then FORCE="--force"; fi
          python -m ingest.main --config config --prev ../feed --out ../feed $FORCE
          cat ../feed/saskatoon/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish feed branch (single commit, force-pushed so history stays small)
        run: |
          rm -rf /tmp/pub && mkdir /tmp/pub
          rsync -a --exclude .git feed/ /tmp/pub/
          cd /tmp/pub
          printf '# SaskEvents data feed\n\nGenerated by the Ingest events workflow. See saskatoon/report.md for source health.\n' > README.md
          git init -q -b feed
          git config user.name "saskevents-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Feed $(date -u +%Y-%m-%dT%H:%MZ) from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:feed
