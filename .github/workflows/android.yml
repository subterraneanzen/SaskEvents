name: Android build & test

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml", ".github/scripts/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, APKs and test APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests + screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: bash ../.github/scripts/device-tests.sh

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk ../out/YXE-Events.apk || true
          cp app/build/outputs/apk/debug/app-debug.apk ../out/YXE-Events-debug.apk || true
          cp -r device-out/* ../out/ 2>/dev/null || true
          cp -r app/build/reports/tests ../out/unit-test-report 2>/dev/null || true
          ls -la ../out ../out/screenshots 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yxe-events-build
          path: out/

      - name: Publish rolling "latest" release
        if: success() && github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag 2>/dev/null || true
          git push --delete origin latest 2>/dev/null || true
          {
            echo "Automatic build of \`${GITHUB_SHA::7}\` (run ${{ github.run_number }})."
            echo
            echo "Install **YXE-Events.apk** on your phone (allow installs from this source when Android asks)."
            echo "Screenshots were taken on a Pixel 6 emulator during the automated test run."
            echo
            cat out/instrumentation.txt 2>/dev/null | tail -5 | sed 's/^/    /'
          } > notes.md
          gh release create latest --prerelease --title "YXE Events – latest build" --notes-file notes.md --target "$GITHUB_SHA" \
            out/YXE-Events.apk out/screenshots/*.png
